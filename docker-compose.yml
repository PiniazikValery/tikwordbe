version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tickword-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tickword
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  whisper-gpu:
    build:
      context: .
      dockerfile: Dockerfile.whisper.gpu
    image: tickword-whisper-gpu:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["echo", "Whisper GPU image built successfully"]

volumes:
  postgres_data:
